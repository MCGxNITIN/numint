# Recon site templates (IntelTechniques-style "open all" phone tool).
#
# When you run recon, Numint fills these templates for the number and opens
# each in your browser (CLI) or in new tabs (web). It only builds URLs and
# opens them for manual review; it never scrapes or logs in anywhere.
#
# Placeholders:
#   {area}     -> 415        (NANP area code, US/Canada numbers)
#   {prefix}   -> 555        (NANP exchange)
#   {suffix}   -> 0123       (NANP subscriber)
#   {digits10} -> 4155550123 (NANP national significant number)
#   {natdigits}-> national significant digits (any country)
#   {digits}   -> full E.164 digits incl. country code (e.g. 14155550123)
#   {e164}     -> +14155550123
#   {plus_enc} -> %2B14155550123  (URL-encoded E.164)
#   {iso}      -> us          (lower-case country code)
#
# scope: "us" entries are opened only for NANP numbers (US/Canada). "global"
# entries are opened for any country.

reverse_lookup:
  - {label: "ThatsThem", scope: us, template: "https://thatsthem.com/phone/{area}-{prefix}-{suffix}"}
  - {label: "TruePeopleSearch", scope: us, template: "https://www.truepeoplesearch.com/results?phoneno=({area}){prefix}-{suffix}"}
  - {label: "FastPeopleSearch", scope: us, template: "https://www.fastpeoplesearch.com/{area}-{prefix}-{suffix}"}
  - {label: "SearchPeopleFree", scope: us, template: "https://www.searchpeoplefree.com/phone-lookup/{area}-{prefix}-{suffix}"}
  - {label: "CyberBackgroundChecks", scope: us, template: "https://www.cyberbackgroundchecks.com/phone/{area}-{prefix}-{suffix}"}
  - {label: "AdvancedBackgroundChecks", scope: us, template: "https://www.advancedbackgroundchecks.com/{area}-{prefix}-{suffix}"}
  - {label: "USPhonebook", scope: us, template: "https://www.usphonebook.com/{area}-{prefix}-{suffix}"}
  - {label: "PeopleSearchNow", scope: us, template: "https://www.peoplesearchnow.com/phone/{area}-{prefix}-{suffix}"}
  - {label: "Whitepages", scope: us, template: "https://www.whitepages.com/phone/1-{area}-{prefix}-{suffix}"}
  - {label: "411", scope: us, template: "https://www.411.com/phone/1-{area}-{prefix}-{suffix}"}
  - {label: "CallerSmart", scope: us, template: "https://www.callersmart.com/phone-number/{area}-{prefix}-{suffix}"}
  - {label: "Spytox", scope: us, template: "https://www.spytox.com/people/search?phone={area}-{prefix}-{suffix}"}
  - {label: "Nuwber", scope: us, template: "https://nuwber.com/search/phone?phone={digits10}"}
  - {label: "ZabaSearch", scope: us, template: "https://www.zabasearch.com/phone/{digits10}"}
  - {label: "PhoneOwner", scope: us, template: "https://phoneowner.com/phone/{digits10}"}
  - {label: "OKCaller", scope: us, template: "https://www.okcaller.com/{digits10}"}
  - {label: "WhoseNo", scope: us, template: "https://www.whoseno.com/US/{digits10}"}
  - {label: "800notes", scope: us, template: "https://800notes.com/Phone.aspx/1-{area}-{prefix}-{suffix}"}
  - {label: "Infotracer", scope: us, template: "https://infotracer.com/phone-lookup/results/?phone={digits10}"}
  - {label: "Numpi", scope: us, template: "https://numpi.com/phone-info/{digits10}"}
  - {label: "YellowPages", scope: us, template: "https://people.yellowpages.com/whitepages/phone-lookup?phone={digits10}"}
  - {label: "Sync.me", scope: global, template: "https://sync.me/search/?number={digits}"}
  - {label: "Truecaller", scope: global, template: "https://www.truecaller.com/search/{iso}/{natdigits}"}

search_engines:
  - {label: "Google (exact)", scope: global, template: "https://www.google.com/search?q=%22{e164}%22"}
  - {label: "Google (dashed)", scope: us, template: "https://www.google.com/search?q=%22{area}-{prefix}-{suffix}%22"}
  - {label: "Google (Craigslist)", scope: us, template: "https://www.google.com/search?q=site%3Acraigslist.org+%22{area}-{prefix}-{suffix}%22"}
  - {label: "Bing", scope: global, template: "https://www.bing.com/search?q=%22{e164}%22"}
  - {label: "Yandex", scope: global, template: "https://yandex.com/search/?text=%22{e164}%22"}
  - {label: "Facebook (public search)", scope: global, template: "https://www.facebook.com/search/top?q={plus_enc}"}
